# one build per python x pytorch combination
python:
  - "3.11"
  - "3.12"
  - "3.13"
pytorch:
  - "2.7"
c_compiler:
  - gcc
cxx_compiler:
  - gxx
# CUDA 12.6 supports gcc up to 13
c_compiler_version:
  - "13"
cxx_compiler_version:
  - "13"
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.17"
cuda_compiler:
  - cuda-nvcc
cuda_compiler_version:
  - "12.6"
